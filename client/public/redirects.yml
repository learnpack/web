# Redirects Configuration
# Define URL redirects with "from" and "to" paths
# Both paths can be relative or absolute
# All query string parameters are automatically preserved

redirects:
  # Example absolute redirect (update with your actual URL)
  - from: /my-tutorials
    to: https://4geeks.com/interactive-coding-tutorials
  
  # Relative redirects
  - from: /old-pricing
    to: /pricing
  
  - from: /legacy-terms
    to: /terms-and-conditions

  # Use cases redirects (hyphenated to non-hyphenated)
  - from: /use-cases/compliance
    to: /usecases/compliance
  
  - from: /use-cases/role-based
    to: /usecases/role-based
  
  - from: /use-cases/software-training
    to: /usecases/software-training
