<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fallback title/description for non-JS environments - will be replaced by react-helmet-async -->
    <title>LearnPack - Turn ideas into interactive learning packages in minutes</title>
    <meta name="description" content="Type any topic, choose a purpose, and generate a course you can export anywhere. Cut training creation costs by 80% and double completion rates." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- Language alternate links - static SEO for multilingual -->
    <link rel="alternate" hreflang="en" href="https://learnpack.co/" />
    <link rel="alternate" hreflang="es" href="https://learnpack.co/?lang=es" />
    <link rel="alternate" hreflang="x-default" href="https://learnpack.co/" />
    
    <!-- All other meta tags (OG, Twitter, canonical) managed by react-helmet-async per page/language -->
    
    <!-- JSON-LD Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LearnPack",
      "applicationCategory": "Educational Technology",
      "description": "Turn ideas into interactive learning packages in minutes — export anywhere.",
      "url": "https://learnpack.co",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "USD",
        "price": "100",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "100",
          "priceCurrency": "USD",
          "billingIncrement": "MONTH"
        }
      }
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
